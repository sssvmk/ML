[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optpipe"
version = "0.1.0"
description = "MNIST optimization study (Deep Learning book, chapter 8)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "mlflow>=3.0",
    "optuna>=3.5",
    "scikit-learn>=1.3",
    "numpy",
    "pandas",
    "matplotlib",
    "pyyaml",
    "pillow",
    "pytest"
]

[tool.setuptools.packages.find]
include = ["optpipe", "optpipe.*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = [
    "tests",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')"
]
