# Single source of truth for training. Values marked ASSUMED are listed in TODO.md until confirmed.
experiment_name: vgg-cifar100
run_name: null
phase: baseline                 # tag only: baseline | candidate
seed: 42

data:
  dataset: cifar100             # cifar100 | synthetic (offline smoke tests only)
  root: ./data
  num_classes: 100
  val_fraction: 0.10            # stratified split of the 50k train images
  batch_size: 128
  num_workers: 4                # 8-core CPU: 4 workers keep an iGPU fed; use 0 for debugging
  pin_memory: false             # no benefit on an iGPU that shares system RAM
  subset_train: null            # int -> use only N train images (debugging)
  subset_eval: null             # int -> use only N val/test images (debugging)
  synthetic_size: 600           # used only when dataset: synthetic

model:
  arch: vgg16                   # vgg11 | vgg13 | vgg16 | vgg19
  batch_norm: true              # original VGG has none; BN makes from-scratch training reliable
  width_mult: 1.0               # 0.5 cuts FLOPs ~4x (use on CPU-only laptops)
  head_hidden: 512
  dropout: 0.5

metric:
  name: top1_accuracy           # ASSUMED (Checkpoint 1 not confirmed)
  target_value: 0.65            # ASSUMED, sized for a ~40-epoch laptop budget
  higher_is_better: true

training:
  max_epochs: 40
  optimizer: sgd                # sgd | adamw
  lr: 0.05
  momentum: 0.9
  nesterov: true
  weight_decay: 0.0005          # applied to weights only, not BN/bias
  warmup_epochs: 2
  label_smoothing: 0.0
  grad_clip: null
  amp: true                     # fp16 autocast on GPU (CUDA or ROCm); `gpu-check` measures whether it helps
  channels_last: false          # NVIDIA tends to like it; on AMD let `gpu-check` decide
  early_stopping_patience: 8
  device: auto                  # auto | cpu | cuda (ROCm builds of PyTorch also show up as cuda) | mps
  resume_from: null             # path to a last.pt to resume

sanity:                         # Ch. 11 debugging checks, run before training
  enabled: true
  initial_loss_tol: 0.5         # |loss - ln(K)| must be below this
  overfit_batch: 32
  overfit_steps: 80
  fail_hard: true

promotion:
  min_improvement: 0.0          # val top-1 margin over current champion
  require_target: true
