[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mnist-regularization"
version = "0.1.0"
description = "MNIST regularization study (Deep Learning book, chapter 7)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "mlflow>=3.0",
    "optuna>=3.5",
    "scikit-learn>=1.3",
    "numpy",
    "pandas",
    "matplotlib",
    "pyyaml",
    "pillow",
    "pytest"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::UserWarning"
]
