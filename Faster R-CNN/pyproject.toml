[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faster-rcnn"
version = "0.1.0"
description = "Faster R-CNN on Pascal VOC 2007: training, MLflow tracking, registry, inference"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "mlflow==3.16.1",
    "numpy==2.4.4",
    "pandas==3.0.2",
    "matplotlib==3.10.8",
    "pillow==12.1.1",
    "pyyaml==6.0.3",
    "sqlalchemy==2.1.3",
    "alembic==1.20.0",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.16.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
extend-exclude = ["scripts/diagnose_curves.py", "mlruns"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E701", "E702", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
