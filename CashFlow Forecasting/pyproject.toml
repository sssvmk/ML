[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stc-cashflow-forecasting"
version = "0.1.0"
description = "End-to-end time-series forecasting pipeline for cash flow estimation supporting statistical baselines, tree-based ML, and deep learning algorithms."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "torch>=2.0",
    "lightning>=2.0",
    "torchmetrics>=1.0",
    "einops>=0.6",
    "gluonts>=0.14",
    "prophet>=1.1",
    "cmdstanpy>=1.0",
    "transformers>=4.30",
    "huggingface_hub>=0.20",
    "safetensors>=0.4",
    "timesfm==3.0.2",
    "mlflow>=2.10",
    "optuna>=3.0",
    "pyarrow>=12",
    "openpyxl>=3.1",
    "pydantic>=2.0",
    "toolz>=0.12",
    "tqdm>=4.60",
    "holidays>=0.40",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "setuptools>=68"
]

[project.scripts]
stc-demo = "demo:main"
stc-calibration = "calibration.run_calibration:main"
stc-traceability = "generate_traceability:main"
