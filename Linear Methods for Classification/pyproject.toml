[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linear-methods-for-classification"
version = "0.1.0"
description = "A benchmarking framework to evaluate linear classification methods."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "threadpoolctl",
    "rich",
    "numba"
]

[project.optional-dependencies]
dev = [
    "pytest"
]
