[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ensemble-isle"
version = "0.1.0"
description = "ESLII Ch. 16 - ensemble learning: ISLE, RuleFit and boosting as a regularization path (Zillow regression, Santander classification)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "threadpoolctl",
    "rich"
]
