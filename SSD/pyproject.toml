[tool.ruff]
line-length = 120
extend-exclude = ["notebooks"]            # generated by tools/build_notebook.py
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E701", "E702", "E741", "B008", "B905"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "I001", "B018"]
"tools/*" = ["E402"]
[tool.pytest.ini_options]
testpaths = ["tests"]
