[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airsat"
version = "0.1.0"
description = "Config-driven ML experimentation, selection and inference pipeline for airline passenger satisfaction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "pyyaml>=6.0",
  "joblib>=1.3",
  "pyarrow>=14",
  "optuna>=3.5",
  "xgboost>=2.0",
  "lightgbm>=4.1",
  "mlflow>=2.12",
]

[project.optional-dependencies]
deep = ["torch>=2.2"]
agent = ["ag2[openai]>=0.9,<1.0"]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]
all = ["airsat[deep,agent,serve,dev]"]

[project.scripts]
airsat-run = "airsat.run_pipeline:main"
airsat-predict = "airsat.predict:main"
airsat-explain = "airsat.agent.ag2_explainer:main"
airsat-serve = "airsat.serving.app:main"
airsat-promote = "airsat.promote:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
