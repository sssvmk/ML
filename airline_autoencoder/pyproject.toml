[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeclf"
version = "0.1.0"
description = "Mixed-type autoencoder pretraining (AE / DAE / VAE) and encoder-based satisfaction classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.4", "matplotlib>=3.8", "seaborn>=0.13",
  "pyyaml>=6.0", "joblib>=1.3", "pyarrow>=14", "optuna>=3.5", "mlflow>=2.12", "torch>=2.2", "lightgbm>=4.1",
]

[project.optional-dependencies]
agent = ["ag2[openai]>=0.9,<1.0"]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]
all = ["aeclf[agent,serve,dev]"]

[project.scripts]
aeclf-run = "aeclf.run_pipeline:main"
aeclf-predict = "aeclf.predict:main"
aeclf-explain = "aeclf.agent.ag2_explainer:main"
aeclf-serve = "aeclf.serving.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
