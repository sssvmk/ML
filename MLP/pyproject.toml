[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlp"
version = "0.1.0"
description = "Machine Learning Pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "mlflow>=3.0",
    "optuna>=3.5",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mlp-run = "run:main"
mlp-infer = "infer:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools]
py-modules = [
    "datasources",
    "infer",
    "metrics",
    "mlp_core",
    "report",
    "run",
    "serving_model",
    "splits",
    "tabular",
    "tracking",
    "tuning"
]
